<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - F5 ADC For AI Demo</title>
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <img src="/static/img/f5-icon.svg" alt="F5" />
        <div>
          <p class="brand-title">F5 ADC For AI 场景演示</p>
          <p class="brand-subtitle">展现 F5 BIG-IP 面向 Agentic AI 与 LLM 场景能力</p>
        </div>
      </div>
      <h1 class="form-title">账号登录 | Account Login</h1>
      <div class="row">
        <label for="username">用户名 | User Name</label>
        <input id="username" type="text" autocomplete="username" />
      </div>
      <div class="row row-password">
        <label for="password">密码 | Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="togglePassword" class="toggle-password" type="button" data-show="false" aria-label="显示密码">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
          <svg class="eye-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.3A10.4 10.4 0 0 1 12 6c6.2 0 10 6 10 6a18.4 18.4 0 0 1-3 3.8"></path>
            <path d="M6.6 6.7C3.9 8.3 2 12 2 12s3.8 6 10 6c1.5 0 2.9-.3 4.1-.8"></path>
          </svg>
        </button>
      </div>
      <button id="btnLogin" class="btn-login" type="button">登录 | Login</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <script>
    const btn = document.getElementById("btnLogin");
    const err = document.getElementById("err");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const returnTo = {{ return_to | tojson }};

    function togglePasswordVisibility() {
      const shown = passwordInput.type === "text";
      passwordInput.type = shown ? "password" : "text";
      togglePassword.dataset.show = String(!shown);
      togglePassword.setAttribute("aria-label", shown ? "显示密码" : "隐藏密码");
    }

    async function doLogin() {
      err.textContent = "";
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        err.textContent = "请输入用户名和密码";
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password, return_to: returnTo }),
        });
        if (!res.ok) {
          let msg = await res.text();
          try {
            const j = JSON.parse(msg);
            msg = j.detail || msg;
          } catch (_) {}
          err.textContent = "登录失败: " + msg;
          return;
        }
        const data = await res.json();
        window.location.href = data.redirect_url || "/";
      } catch (e) {
        err.textContent = "登录失败: 网络错误";
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", doLogin);
    togglePassword.addEventListener("click", togglePasswordVisibility);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
