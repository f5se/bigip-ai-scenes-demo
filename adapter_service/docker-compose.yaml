# docker-compose.yaml
version: "3"

services:
  prometheus:
    image: docker.1ms.run/prom/prometheus:latest
    #extra_hosts:
      #- "host.docker.internal:host-gateway"     # allow a direct connection from container to the local machine
    ports:
      - "9090:9090"   # the default port used by Prometheus
    volumes:
      - ${PWD}/prometheus.yaml:/etc/prometheus/prometheus.yml # mount Prometheus config file

  grafana:
    image: docker.1ms.run/grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3001:3000" # the default port used by Grafana